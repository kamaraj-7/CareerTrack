<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Tracker | Job Monitoring Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        @media (max-width: 850px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dark);
        }

        /* Form Elements */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-icon { padding: 10px; }
        
        .btn-scan {
            width: 100%;
            margin-top: 10px;
            background: var(--success);
            color: white;
            font-size: 1rem;
        }

        /* Tags */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: #eff6ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #dbeafe;
        }

        .tag i {
            cursor: pointer;
            font-size: 0.75rem;
        }

        .tag i:hover { color: var(--danger); }

        /* Sources */
        .source-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .source-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Job Feed */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .job-item {
            background: white;
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 15px;
            border-left: 5px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .job-item:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }

        .job-main h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .job-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .job-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-gray);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: var(--radius);
            padding: 30px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-gray);
        }

        .modal-header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .modal-body p {
            margin-bottom: 15px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-blue { background: #dbeafe; color: #1e40af; }

        /* Status Toggle */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .status-active .status-dot {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
        }

        .stat-box span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .stat-box strong {
            font-size: 1.4rem;
            color: var(--primary);
        }

        @media (max-width: 600px) {
            .stats-row { grid-template-columns: 1fr; }
            .job-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .job-actions { width: 100%; }
            .job-actions .btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            <i class="fas fa-radar"></i>
            CareerTrack Pro
        </div>
        <div class="status-bar" id="monitor-status-ui">
            <div class="status-dot"></div>
            <span>Monitoring: OFF</span>
        </div>
    </header>

    <div class="stats-row">
        <div class="stat-box">
            <span>COMPANIES</span>
            <strong id="stat-companies">0</strong>
        </div>
        <div class="stat-box">
            <span>ROLES</span>
            <strong id="stat-roles">0</strong>
        </div>
        <div class="stat-box">
            <span>ALERTS</span>
            <strong id="stat-alerts">0</strong>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Sidebar -->
        <aside>
            <div class="card">
                <h2 class="card-title"><i class="fas fa-building"></i> Target Companies</h2>
                <div class="input-group">
                    <input type="text" id="company-input" placeholder="Add company name...">
                    <button class="btn btn-primary btn-icon" onclick="addPreference('company')">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div id="company-tags" class="tags-container"></div>
            </div>

            <div class="card">
                <h2 class="card-title"><i class="fas fa-user-tie"></i> Job Roles</h2>
                <div class="input-group">
                    <input type="text" id="role-input" placeholder="Add job title...">
                    <button class="btn btn-primary btn-icon" onclick="addPreference('role')">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div id="role-tags" class="tags-container"></div>
            </div>

            <div class="card">
                <h2 class="card-title"><i class="fas fa-layer-group"></i> Sources</h2>
                <div class="source-list">
                    <label class="source-item"><input type="checkbox" checked> LinkedIn</label>
                    <label class="source-item"><input type="checkbox" checked> Naukri</label>
                    <label class="source-item"><input type="checkbox" checked> Foundit</label>
                    <label class="source-item"><input type="checkbox" checked> Career Pages</label>
                </div>
                <button class="btn btn-scan" onclick="manualScan()">
                    <i class="fas fa-search"></i> Scan Now
                </button>
            </div>
        </aside>

        <!-- Main Feed -->
        <main>
            <div class="feed-header">
                <h2 class="card-title" style="margin:0"><i class="fas fa-stream"></i> Live Feed</h2>
                <button class="btn" style="background:#f1f5f9; color:var(--text-gray)" onclick="clearFeed()">
                    Clear Feed
                </button>
            </div>
            <div id="job-feed">
                <!-- Jobs injected here -->
            </div>
        </main>
    </div>
</div>

<!-- Job Detail Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <i class="fas fa-times close-modal" onclick="closeModal()"></i>
        <div id="modal-content">
            <!-- Content injected here -->
        </div>
    </div>
</div>

<script>
    // State
    let state = {
        companies: ['Google', 'Amazon', 'Stripe'],
        roles: ['Software Engineer', 'Product Manager'],
        alerts: []
    };

    // Load from LocalStorage
    function loadData() {
        const saved = localStorage.getItem('careerTrackPro');
        if (saved) {
            state = JSON.parse(saved);
        }
        renderAll();
    }

    function saveData() {
        localStorage.setItem('careerTrackPro', JSON.stringify(state));
        updateStats();
    }

    // UI Rendering
    function renderAll() {
        renderTags('company');
        renderTags('role');
        renderFeed();
        updateStats();
    }

    function renderTags(type) {
        const container = document.getElementById(`${type}-tags`);
        const items = type === 'company' ? state.companies : state.roles;
        container.innerHTML = items.map((item, index) => `
            <div class="tag">
                ${item}
                <i class="fas fa-times" onclick="removePreference('${type}', ${index})"></i>
            </div>
        `).join('');
    }

    function renderFeed() {
        const feed = document.getElementById('job-feed');
        if (state.alerts.length === 0) {
            feed.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <p>No jobs found yet. Add companies and roles, then click "Scan Now".</p>
                </div>
            `;
            return;
        }

        feed.innerHTML = state.alerts.map((job, index) => `
            <div class="job-item">
                <div class="job-main">
                    <h3>${job.role}</h3>
                    <div class="job-meta">
                        <span><i class="fas fa-building"></i> ${job.company}</span>
                        <span><i class="fas fa-map-marker-alt"></i> ${job.location}</span>
                        <span><i class="fas fa-clock"></i> ${job.posted}</span>
                    </div>
                </div>
                <div class="job-actions">
                    <button class="btn btn-primary" onclick="viewJob(${index})">View Details</button>
                </div>
            </div>
        `).join('');
    }

    function updateStats() {
        document.getElementById('stat-companies').innerText = state.companies.length;
        document.getElementById('stat-roles').innerText = state.roles.length;
        document.getElementById('stat-alerts').innerText = state.alerts.length;
    }

    // Actions
    function addPreference(type) {
        const input = document.getElementById(`${type}-input`);
        const val = input.value.trim();
        if (val) {
            if (type === 'company') state.companies.push(val);
            else state.roles.push(val);
            input.value = '';
            saveData();
            renderTags(type);
        }
    }

    function removePreference(type, index) {
        if (type === 'company') state.companies.splice(index, 1);
        else state.roles.splice(index, 1);
        saveData();
        renderTags(type);
    }

    function manualScan() {
        if (state.companies.length === 0 || state.roles.length === 0) {
            alert("Please add at least one company and one role first!");
            return;
        }

        const statusUI = document.getElementById('monitor-status-ui');
        statusUI.classList.add('status-active');
        statusUI.querySelector('span').innerText = "Monitoring: SCANNING...";

        // Simulate network delay
        setTimeout(() => {
            const newJobs = generateMockJobs(3);
            state.alerts = [...newJobs, ...state.alerts].slice(0, 20);
            saveData();
            renderFeed();
            
            statusUI.classList.remove('status-active');
            statusUI.querySelector('span').innerText = "Monitoring: IDLE";
            
            // Show notification
            if (Notification.permission === "granted") {
                new Notification("New Jobs Found!", { body: `Found ${newJobs.length} new matches for your criteria.` });
            }
        }, 1500);
    }

    function generateMockJobs(count) {
        const locations = ['Remote', 'San Francisco', 'New York', 'London', 'Bangalore'];
        const sources = ['LinkedIn', 'Naukri', 'Foundit', 'Direct'];
        const results = [];

        for (let i = 0; i < count; i++) {
            const company = state.companies[Math.floor(Math.random() * state.companies.length)];
            const role = state.roles[Math.floor(Math.random() * state.roles.length)];
            results.push({
                id: Date.now() + i,
                company,
                role,
                location: locations[Math.floor(Math.random() * locations.length)],
                source: sources[Math.floor(Math.random() * sources.length)],
                posted: 'Just now',
                description: `We are looking for a talented ${role} to join our team at ${company}. This is a high-impact role where you will work on cutting-edge technology and help shape the future of our products.`,
                requirements: ['3+ years of experience', 'Strong communication skills', 'Expertise in relevant tech stack', 'Problem-solving mindset']
            });
        }
        return results;
    }

    function clearFeed() {
        state.alerts = [];
        saveData();
        renderFeed();
    }

    // Modal Logic
    function viewJob(index) {
        const job = state.alerts[index];
        const content = document.getElementById('modal-content');
        content.innerHTML = `
            <div class="modal-header">
                <span class="badge badge-blue">${job.source}</span>
                <h2 style="margin-top:10px">${job.role}</h2>
                <p style="color:var(--text-gray); font-weight:600">${job.company} • ${job.location}</p>
            </div>
            <div class="modal-body">
                <h3>Job Description</h3>
                <p>${job.description}</p>
                <h3>Requirements</h3>
                <ul style="margin-left:20px; margin-bottom:20px">
                    ${job.requirements.map(r => `<li>${r}</li>`).join('')}
                </ul>
                <button class="btn btn-primary" style="width:100%" onclick="window.open('https://google.com/search?q=${job.company}+${job.role}+jobs', '_blank')">
                    Apply on ${job.source}
                </button>
            </div>
        `;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    // Close modal on outside click
    window.onclick = function(event) {
        const modal = document.getElementById('modal-overlay');
        if (event.target == modal) closeModal();
    }

    // Request Notification Permission
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    // Init
    loadData();
</script>

</body>
</html>
